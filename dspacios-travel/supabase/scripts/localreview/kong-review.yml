# Gateway LOCAL de la revisión consolidada (como Supabase): una sola URL para Auth, REST y Storage. Solo local; CORS abierto para el navegador en 127.0.0.1.
_format_version: "2.1"
services:
  - name: auth
    url: http://rev-auth:9999/
    routes: [{ name: auth, strip_path: true, paths: [/auth/v1/] }]
  - name: rest
    url: http://rev-rest:3000/
    routes: [{ name: rest, strip_path: true, paths: [/rest/v1/] }]
  - name: storage
    url: http://rev-storage:5000/
    routes: [{ name: storage, strip_path: true, paths: [/storage/v1/] }]
plugins:
  - name: cors
