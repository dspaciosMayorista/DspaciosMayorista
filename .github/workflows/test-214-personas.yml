# Piloto CI de #32 (migración 214, registro central de personas), aprobado por el dueño.
# Ejecuta SOLO las pruebas focales de la 214 contra un PostgreSQL (imagen de Supabase) y un
# PostgREST desechables, creados y destruidos dentro del runner: ciclo preflight/postcheck,
# prueba SQL, API/RLS con JWT firmados con un secreto local aleatorio, carreras entre sesiones y
# rollback. Sin secretos del repositorio, sin Supabase remoto, sin pull_request_target y con
# permisos de solo lectura. Producción sigue con preflight/SQL/postcheck manuales y autorizados.
name: test-214-personas

on:
  pull_request:
    branches: [main]
    # Solo cuando cambia algo que estas pruebas cubren (ahorra minutos).
    paths:
      - '.github/workflows/test-214-personas.yml'
      - 'dspacios-travel/supabase/migrations/20260601000214_personas_identidad.sql'
      - 'dspacios-travel/supabase/scripts/preflight_214_personas_identidad.sql'
      - 'dspacios-travel/supabase/scripts/postcheck_214_personas_identidad.sql'
      - 'dspacios-travel/supabase/scripts/rollback_214_personas_identidad.sql'
      - 'dspacios-travel/supabase/scripts/test_214_personas_identidad.sql'
      - 'dspacios-travel/supabase/scripts/test_214_personas_carreras.sh'
      - 'dspacios-travel/supabase/scripts/preparar_esquema_local.sh'
      - 'dspacios-travel/pruebas/fixtures/personasIdentidad.vectores.json'
  workflow_dispatch:

permissions:
  contents: read

# Un solo run por PR (o rama): uno nuevo cancela el anterior.
concurrency:
  group: test-214-personas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prueba-214:
    name: 214 · SQL, API/RLS, carreras y rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CT: pg214_ci
      RED: red214
      PLANTILLA: plantilla214ci
      IMAGEN_PG: public.ecr.aws/supabase/postgres:15.8.1.085
    defaults:
      run:
        shell: bash
        working-directory: dspacios-travel
    steps:
      - name: Código (solo lectura, sin credenciales persistidas)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: PostgreSQL desechable (imagen de Supabase) en una red propia
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker network create "$RED"
          # Contraseña local de un contenedor efímero que nunca sale del runner (no es un secreto).
          docker run -d --name "$CT" --network "$RED" -e POSTGRES_PASSWORD=postgres "$IMAGEN_PG"

      - name: Esquema 001-213 (incluye 211, 212 y 213) sin la 214
        timeout-minutes: 15
        run: bash supabase/scripts/preparar_esquema_local.sh "$CT" 213 "$PLANTILLA"

      - name: Migración 214 real (M, F, S, K, RB y H con PostgREST local)
        timeout-minutes: 20
        run: |
          set -uo pipefail
          salida="$RUNNER_TEMP/test214.out"
          bash supabase/scripts/test_214_personas_carreras.sh "$CT" "$PLANTILLA" "$RED" 2>&1 | tee "$salida"
          rc="${PIPESTATUS[0]}"
          # Además del código de salida: ningún FALLO, ninguna sección omitida, el cierre en verde y
          # una línea OK de cada bloque (un bloque que se saltara en silencio no puede dar verde).
          faltan=""
          for marca in 'OK    F12 ' 'OK    M7 ' 'OK    S1 ' 'OK    K10 ' 'OK    RB7b ' 'OK    RB9 ' 'OK    H21 '; do
            grep -qF "$marca" "$salida" || faltan="$faltan [$marca]"
          done
          if [ "$rc" != 0 ] || grep -q '^FALLO' "$salida" || grep -q 'omitida' "$salida" \
             || ! grep -q 'TEST 214 CARRERAS/INTEGRACIÓN: TODO OK' "$salida" || [ -n "$faltan" ]; then
            echo "::error::Pruebas 214 en rojo (rc=$rc; faltan:${faltan:- ninguna})"
            exit 1
          fi

      - name: Diagnóstico del contenedor (solo si falla)
        if: failure()
        working-directory: .
        run: docker logs --tail 200 "$CT" 2>&1 || true

      - name: Limpieza de contenedores y red (siempre, también si falla o se cancela)
        if: always()
        working-directory: .
        run: |
          docker ps -aq --filter "name=pgrst214_" | xargs -r docker rm -f || true
          docker rm -f "$CT" || true
          docker network rm "$RED" || true
