# Gate 2 de #39 (migraciones 216 y 217: edición de cotizaciones dinámicas y frontera de la Data API).
# Ejecuta SOLO las pruebas focales contra un PostgreSQL (imagen de Supabase) y un PostgREST
# desechables, creados y destruidos dentro del runner: fases A/B y rollback, batería SQL, prueba W,
# carreras entre sesiones y API/RLS con JWT firmados con un secreto local aleatorio. Un segundo job
# corre las pruebas TS de #39 (R4, cableado, acciones, liquidación, paridad #35 y tenant) en una
# imagen oficial de Node con versión exacta. Sin secretos del repositorio, sin Supabase remoto, sin
# pull_request_target y con permisos de solo lectura.
# Producción sigue con preflight/migración/postcheck manuales y autorizados por el dueño.
name: test-216-217-cotizacion-edicion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-216-217-cotizacion-edicion.yml'
      - 'dspacios-travel/supabase/migrations/20260601000216_cotizacion_manual_edicion_frontera.sql'
      - 'dspacios-travel/supabase/migrations/20260601000217_cotizacion_manual_cierre_frontera.sql'
      - 'dspacios-travel/supabase/scripts/*_216_*'
      - 'dspacios-travel/supabase/scripts/*_217_*'
      - 'dspacios-travel/supabase/scripts/test_216_*'
      - 'dspacios-travel/supabase/scripts/preparar_esquema_local.sh'
      - 'dspacios-travel/pruebas/cotizacionEdicion39*'
      - 'dspacios-travel/pruebas/cotizacionComparativa35Paridad.test.ts'
      - 'dspacios-travel/pruebas/cotizacionesTenant.wiring.test.ts'
      - 'dspacios-travel/app/(dashboard)/dashboard/reservar/actions.ts'
      - 'dspacios-travel/app/(dashboard)/dashboard/cotizaciones/**'
      - 'dspacios-travel/lib/cotizacion/**'
      - 'dspacios-travel/package.json'
      - 'dspacios-travel/pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-216-217-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prueba-216-217:
    name: 216/217 · fases, SQL, carreras, API y rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CT: pg216_ci
      RED: red216
      PLANTILLA: plantilla216ci
      IMAGEN_PG: supabase/postgres:15.8.1.085
      IMAGEN_PGRST: ghcr.io/supabase/postgrest:v16.1
    defaults:
      run:
        shell: bash
        working-directory: dspacios-travel
    steps:
      - name: Código (solo lectura, sin credenciales persistidas)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: PostgreSQL desechable (imagen de Supabase) en una red propia
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker network create "$RED"
          # Contraseña local de un contenedor efímero que nunca sale del runner (no es un secreto).
          docker run -d --name "$CT" --network "$RED" -e POSTGRES_PASSWORD=postgres "$IMAGEN_PG"

      - name: Descargar PostgREST antes del esquema (falla temprano si no hay acceso)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Debe ser la misma imagen que levanta el runner de API.
          grep -qF "$IMAGEN_PGRST" supabase/scripts/test_216_api.sh
          docker pull "$IMAGEN_PGRST"

      - name: Esquema 001-214 sin la 216
        timeout-minutes: 15
        run: bash supabase/scripts/preparar_esquema_local.sh "$CT" 214 "$PLANTILLA"

      - name: Fases A/B, batería SQL, prueba W y rollback (216 y 217 reales)
        timeout-minutes: 20
        run: |
          set -uo pipefail
          salida="$RUNNER_TEMP/fases.out"
          bash supabase/scripts/test_216_fases.sh "$CT" "$PLANTILLA" 2>&1 | tee "$salida"
          rc="${PIPESTATUS[0]}"
          # Además del código de salida: ningún FALLO, el cierre en verde y una línea OK de cada
          # bloque (un bloque que se saltara en silencio no puede dar verde).
          faltan=""
          for marca in 'OK    F9 ' 'OK    M4 ' 'OK    M6 ' 'OK    A0 ' 'OK    A10 ' 'OK    B3 ' 'OK    B5 ' 'OK    B6 ' 'OK    B8 ' \
                       'OK    DV5 ' 'OK    DV6 ' 'OK    DV7 ' 'OK    DV8 ' 'OK    RB1 ' 'OK    RB1.4 ' 'OK    RB3 ' 'OK    RB5 ' 'OK    RB6.1 ' 'OK    RB7 ' \
                       'OK    RB8 ' 'OK    RB8.3 ' 'OK    RB8.4 ' 'OK    RB8.5 '; do
            grep -qF "$marca" "$salida" || faltan="$faltan [$marca]"
          done
          if [ "$rc" != 0 ] || grep -q '^FALLO' "$salida" || grep -q 'FALLO ' "$salida" \
             || ! grep -q 'TEST 216 FASES: TODO OK' "$salida" || [ -n "$faltan" ]; then
            echo "::error::Fases 216/217 en rojo (rc=$rc; faltan:${faltan:- ninguna})"
            exit 1
          fi

      - name: Carreras entre sesiones reales
        timeout-minutes: 15
        run: |
          set -uo pipefail
          salida="$RUNNER_TEMP/carreras.out"
          bash supabase/scripts/test_216_carrera.sh "$CT" "$PLANTILLA" 2>&1 | tee "$salida"
          rc="${PIPESTATUS[0]}"
          faltan=""
          for marca in 'OK    C1 ' 'OK    C2 ' 'OK    C3 ' 'OK    C4 ' 'OK    C5a ' 'OK    C5b ' 'OK    C6 ' 'OK    C7 ' 'OK    C8 ' \
                       'OK    C10a ' 'OK    C10b ' 'OK    C9 '; do
            grep -qF "$marca" "$salida" || faltan="$faltan [$marca]"
          done
          if [ "$rc" != 0 ] || grep -q '^FALLO' "$salida" || ! grep -q 'TEST 216 CARRERAS: TODO OK' "$salida" || [ -n "$faltan" ]; then
            echo "::error::Carreras 216/217 en rojo (rc=$rc; faltan:${faltan:- ninguna})"
            exit 1
          fi

      - name: API (PostgREST local con JWT firmados) y GraphQL
        timeout-minutes: 15
        run: |
          set -uo pipefail
          salida="$RUNNER_TEMP/api.out"
          bash supabase/scripts/test_216_api.sh "$CT" "$PLANTILLA" "$RED" 2>&1 | tee "$salida"
          rc="${PIPESTATUS[0]}"
          faltan=""
          for marca in 'OK    H1 ' 'OK    X2 ' 'OK    X3 ' 'OK    X5 ' 'OK    X5.1 ' 'OK    X6 ' 'OK    X6.1 ' 'OK    A3 ' 'OK    D2 ' 'OK    D10 ' \
                       'OK    D14 ' 'OK    O1 ' 'OK    O2 ' 'OK    O4 ' 'OK    L1 ' 'OK    L2 ' 'OK    L3 '; do
            grep -qF "$marca" "$salida" || faltan="$faltan [$marca]"
          done
          if [ "$rc" != 0 ] || grep -q '^FALLO' "$salida" || ! grep -q 'TEST 216 API: TODO OK' "$salida" || [ -n "$faltan" ]; then
            echo "::error::API 216/217 en rojo (rc=$rc; faltan:${faltan:- ninguna})"
            exit 1
          fi

      - name: Diagnóstico del contenedor (solo si falla)
        if: failure()
        working-directory: .
        run: docker logs --tail 200 "$CT" 2>&1 || true

      - name: Limpieza de contenedores y red (siempre, también si falla o se cancela)
        if: always()
        working-directory: .
        run: |
          docker ps -aq --filter "name=pgrst216_" | xargs -r docker rm -f || true
          docker rm -f "$CT" || true
          docker network rm "$RED" || true

  pruebas-ts-39:
    name: '#39 · pruebas TS (R4, cableado, acciones, liquidación, paridad, tenant)'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Misma versión que el entorno local de las verificaciones (Node 24.14.0, pnpm 10.33.0 del
      # campo packageManager vía corepack). Imagen oficial con versión exacta, sin acciones extra.
      IMAGEN_NODE: node:24.14.0-bookworm-slim
      CTN: node39_ci
    steps:
      - name: Código (solo lectura, sin credenciales persistidas)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Descargar la imagen de Node (falla temprano si no hay acceso)
        timeout-minutes: 5
        run: docker pull "$IMAGEN_NODE"

      - name: 'Pruebas TS de #39 (sin base de datos; Supabase simulado)'
        timeout-minutes: 15
        run: |
          set -uo pipefail
          salida="$RUNNER_TEMP/ts39.out"
          docker run --rm --name "$CTN" -e CI=1 -e COREPACK_ENABLE_DOWNLOAD_PROMPT=0 \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo/dspacios-travel "$IMAGEN_NODE" sh -ec '
            corepack enable
            pnpm install --frozen-lockfile
            node --test --test-reporter=spec --experimental-strip-types --experimental-test-module-mocks \
              --experimental-loader ./pruebas/support/aliasLoader.mjs \
              pruebas/cotizacionEdicion39R4.test.ts pruebas/cotizacionEdicion39.wiring.test.ts \
              pruebas/cotizacionEdicion39Acciones.test.ts pruebas/cotizacionEdicion39Liquidacion.test.ts \
              pruebas/cotizacionComparativa35Paridad.test.ts pruebas/cotizacionesTenant.wiring.test.ts
          ' 2>&1 | tee "$salida"
          rc="${PIPESTATUS[0]}"
          # Además del código de salida: cero fallos, pruebas realmente corridas y las de R4/cableado
          # presentes en verde (un archivo que no cargara no puede dar verde).
          faltan=""
          for marca in '✔ R4 manual con payload de tarifario plantado' '✔ R4 manual con los pasajeros dentro del payload' \
                       '✔ R4 manual ya convertida' '✔ R4 control: el MISMO payload' \
                       '✔ excepción focal: convertirCotizacion rechaza una manual ANTES del motor' \
                       '✔ el snapshot del primer pago lee los servicios en el MISMO orden que la 216' \
                       '✔ ninguna ruta llama a las RPC 198 de dinero directo'; do
            grep -qF "$marca" "$salida" || faltan="$faltan [$marca]"
          done
          if [ "$rc" != 0 ] || ! grep -qE '^ℹ fail 0$' "$salida" || ! grep -qE '^ℹ tests [1-9][0-9]*$' "$salida" \
             || grep -qE '^✖|^ *✖ ' "$salida" || [ -n "$faltan" ]; then
            echo "::error::Pruebas TS de #39 en rojo (rc=$rc; faltan:${faltan:- ninguna})"
            exit 1
          fi

      - name: Limpieza del contenedor de Node (siempre)
        if: always()
        working-directory: .
        run: docker rm -f "$CTN" || true
