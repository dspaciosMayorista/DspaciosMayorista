# #68 (migración 221, «Clientes de contratos» en el CRM) — pruebas focales.
# Ejecuta, contra un PostgreSQL (imagen de Supabase) y un PostgREST desechables creados y destruidos dentro del
# runner: ciclo preflight/postcheck (una fila consolidada cada uno), batería SQL de la 221 (roles, tenant, guarda de
# homónimos, ficha, búsqueda, ACL), rollback y API con JWT firmados con un secreto local aleatorio (otro tenant,
# otro asesor, usuarios inactivos, roles sin acceso, anon, service_role). Un segundo job corre las pruebas TS de #68
# (acceso a la acción/página, cableado e interfaz) en una imagen oficial de Node con versión exacta.
# Sin secretos del repositorio, sin Supabase remoto, sin pull_request_target y con permisos de solo lectura.
# NO modifica ni reemplaza otros workflows. Producción sigue con preflight/migración/postcheck manuales y
# autorizados por el dueño, y la 220 (#67) se aplica ANTES que la 221 (orden operativo; la 221 no usa objetos de la 220).
name: test-221-clientes-contratos-68

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/test-221-clientes-contratos-68.yml'
      - 'dspacios-travel/supabase/migrations/20260601000221_clientes_contratos_crm.sql'
      - 'dspacios-travel/supabase/scripts/*_221_*'
      # Dependencias de la batería: fixtures de usuarios, esquema local, y las funciones/vistas que la 221 lee.
      - 'dspacios-travel/supabase/scripts/test_216_fixtures.sql'
      - 'dspacios-travel/supabase/scripts/preparar_esquema_local.sh'
      - 'dspacios-travel/supabase/migrations/20260601000142_venta_ve_su_agencia.sql'
      - 'dspacios-travel/supabase/migrations/20260601000156_empaquetados.sql'
      - 'dspacios-travel/lib/crm/clientesContratos68.ts'
      - 'dspacios-travel/pruebas/clientesContratos68*'
      - 'dspacios-travel/types/database.ts'
      - 'dspacios-travel/app/(crm)/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-221-clientes-contratos-68-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prueba-221:
    name: 221 · preflight/postcheck, SQL, rollback y API con JWT
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CT: pg221_ci
      RED: red221
      PLANTILLA: plantilla221ci
      IMAGEN_PG: supabase/postgres:15.8.1.085
      IMAGEN_PGRST: ghcr.io/supabase/postgrest:v16.1
    defaults:
      run:
        shell: bash
        working-directory: dspacios-travel
    steps:
      - name: Código (solo lectura, sin credenciales persistidas)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: PostgreSQL desechable (imagen de Supabase) en una red propia
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker network create "$RED"
          # Contraseña local de un contenedor efímero que nunca sale del runner (no es un secreto).
          docker run -d --name "$CT" --network "$RED" -e POSTGRES_PASSWORD=postgres "$IMAGEN_PG"

      - name: Descargar PostgREST antes del esquema (falla temprano si no hay acceso)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          grep -qF "$IMAGEN_PGRST" supabase/scripts/test_221_clientes_contratos_crm.sh
          docker pull "$IMAGEN_PGRST"

      - name: Cadena integrada 001-219 (214, 216, 217 y 219 incluidas) sin la 221
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # La 221 no depende de la 220 (#67) ni de la 218 (#56): se prueba sobre la cadena realmente integrada hasta la 219.
          bash supabase/scripts/preparar_esquema_local.sh "$CT" 219 "$PLANTILLA"

      - name: Migración 221 real (F, M, S, RB y H con PostgREST local)
        timeout-minutes: 20
        run: |
          # Sin -e: el pipeline con tee puede devolver distinto de 0 y hay que capturar rc para imprimir qué falta.
          set +e
          set -uo pipefail
          salida="$RUNNER_TEMP/test221.out"
          bash supabase/scripts/test_221_clientes_contratos_crm.sh "$CT" "$PLANTILLA" "$RED" 2>&1 | tee "$salida"
          rc="${PIPESTATUS[0]}"
          # Además del código de salida: ningún FALLO, ninguna sección omitida, el cierre en verde y una línea OK de
          # cada bloque (un bloque que se saltara en silencio no puede dar verde).
          faltan=""
          for marca in 'OK    F10 ' 'OK    M1 ' 'OK    M4 ' 'OK    M5 ' 'OK    M6 ' 'OK    M7 ' 'OK    M8 ' 'OK    M9 ' 'OK    M10 ' 'OK    S1 ' \
                       'OK    RB1 ' 'OK    RB2 ' 'OK    RB4 ' 'OK    RB6 ' 'OK    RB7 ' \
                       'OK    H1 ' 'OK    H2 ' 'OK    H5 ' 'OK    H9 ' 'OK    H11 ' 'OK    H13 ' 'OK    H15 ' 'OK    H18 ' 'OK    H21 ' 'OK    H23 ' 'OK    H25 ' \
                       '  OK    A1 ' '  OK    A5.1 ' '  OK    V1 ' '  OK    V4 ' '  OK    V6 ' '  OK    R1 ' '  OK    R4 ' '  OK    R6 ' '  OK    F3 ' '  OK    S9 ' '  OK    S10 ' '  OK    E1 '; do
            grep -qF -- "$marca" "$salida" || faltan="$faltan [$marca]"
          done
          # La sección saltada se detecta por SU línea exacta.
          if [ "$rc" != 0 ] || grep -q '^FALLO' "$salida" || grep -qE '^INFO  H omitida por SIN_API=1' "$salida" \
             || ! grep -q 'TEST 221 CLIENTES CONTRATOS: TODO OK' "$salida" || [ -n "$faltan" ]; then
            echo "::error::Pruebas 221 en rojo (rc=$rc; faltan:${faltan:- ninguna})"
            exit 1
          fi

      - name: Diagnóstico del contenedor (solo si falla)
        if: failure()
        working-directory: .
        run: docker logs --tail 200 "$CT" 2>&1 || true

      - name: Limpieza de contenedores y red (siempre, también si falla o se cancela)
        if: always()
        working-directory: .
        run: |
          docker ps -aq --filter "name=pgrst221_" | xargs -r docker rm -f || true
          docker rm -f "$CT" || true
          docker network rm "$RED" || true

  pruebas-ts-68:
    name: '#68 · pruebas TS (acceso, cableado, interfaz y tipos)'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGEN_NODE: node:24.14.0-bookworm-slim
      CTN: node68_ci
    steps:
      - name: Código (solo lectura, sin credenciales persistidas)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Descargar la imagen de Node (falla temprano si no hay acceso)
        timeout-minutes: 5
        run: docker pull "$IMAGEN_NODE"

      - name: 'Pruebas TS de #68 (sin base de datos) y tsc'
        timeout-minutes: 20
        run: |
          # Sin -e: el pipeline con tee puede devolver distinto de 0 y hay que capturar rc para imprimir qué falta.
          set +e
          set -uo pipefail
          salida="$RUNNER_TEMP/ts68.out"
          docker run --rm --name "$CTN" -e CI=1 -e COREPACK_ENABLE_DOWNLOAD_PROMPT=0 \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo/dspacios-travel "$IMAGEN_NODE" sh -ec '
            corepack enable
            pnpm install --frozen-lockfile
            node --test --test-reporter=spec --experimental-strip-types --experimental-test-module-mocks \
              --experimental-loader ./pruebas/support/aliasLoader.mjs \
              pruebas/clientesContratos68Acceso.test.ts pruebas/clientesContratos68Cableado.test.ts
            node --test --test-reporter=spec --experimental-test-module-mocks \
              --import ./pruebas/support/registrarProgramasRuta.mjs \
              --experimental-loader ./pruebas/support/reactLoader.mjs \
              pruebas/clientesContratos68UI.react.ts
            pnpm exec tsc --noEmit
          ' 2>&1 | tee "$salida"
          rc="${PIPESTATUS[0]}"
          faltan=""
          for marca in '✔ venta: solo contratos propios' '✔ la ficha de un contrato ajeno, de otro tenant o inexistente responde igual' \
                       '✔ la página no lee crm_contactos'; do
            grep -qF "$marca" "$salida" || faltan="$faltan [$marca]"
          done
          if [ "$rc" != 0 ] || ! grep -qE '^ℹ fail 0$' "$salida" || ! grep -qE '^ℹ tests [1-9][0-9]*$' "$salida" \
             || grep -qE '^✖|^ *✖ ' "$salida" || [ -n "$faltan" ]; then
            echo "::error::Pruebas TS de #68 en rojo (rc=$rc; faltan:${faltan:- ninguna})"
            exit 1
          fi

      - name: Limpieza del contenedor de Node (siempre)
        if: always()
        working-directory: .
        run: docker rm -f "$CTN" || true
